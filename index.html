<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Financial Analyst | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="logo-icon">💰</div>
            <span class="brand-name">FinanceAI</span>
        </div>

        <div class="upload-section">
            <p class="sidebar-label">Upload Reports</p>
            <input type="file" id="pdfFile" accept=".pdf" style="display:none;" onchange="handleFileSelect()">
            
            <div id="dragArea" class="drag-area" onclick="document.getElementById('pdfFile').click()">
                <span class="drag-plus">+</span>
                <p>Click or Drop PDF</p>
            </div>
            
            <div id="fileName" class="file-name">No file selected</div>
            
            <button onclick="uploadDoc()" id="processBtn" class="primary-btn">
                🚀 Train AI
            </button>
            
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <div id="docListSection" style="display:none;">
            <hr class="sidebar-divider">
            <p class="sidebar-label">Knowledge Base</p>
            <div id="docList" class="doc-list">
                </div>
        </div>

        <div class="sidebar-footer">
            <button onclick="clearAll()" class="clear-btn">🗑️ Clear All</button>
        </div>
    </aside>

    <main class="chat-main">
        <header class="chat-header">
            <div class="header-info">
                <h1>AI Financial Analyst</h1>
                <p id="docStatus">Waiting for documents...</p>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">+ New Session</button>
        </header>

        <div id="chatBox" class="chat-messages">
            <div class="message ai-message">
                <div class="avatar ai-avatar">AI</div>
                <div class="message-content">
                    👋 <strong>Welcome, Vinay.</strong><br>
                    Upload your financial statements or PDFs to begin a RAG-powered analysis. 
                    I can now handle <strong>multiple documents</strong> simultaneously.
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="quick-chips">
                <button class="chip" onclick="quickQuery('Summarize key financial risks')">⚠️ Risks</button>
                <button class="chip" onclick="quickQuery('Analyze Year-over-Year growth')">📈 YoY Growth</button>
                <button class="chip" onclick="quickQuery('What is the debt-to-equity ratio?')">⚖️ Ratios</button>
            </div>
            
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userQuery" 
                    placeholder="Ask about revenue, margins, or forecasts..." 
                    onkeypress="if(event.key==='Enter') sendQuery()"
                >
                <button onclick="sendQuery()" id="sendBtn" class="send-btn">➤</button>
            </div>
        </div>
    </main>
</div>

<script src="/static/javascript.js"></script>
</body>
</html>
